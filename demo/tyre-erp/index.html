<script>
/* light or dark is set before the first paint, so the page never flashes the wrong one */
(function () {
  var m = 'system';
  try { m = (JSON.parse(localStorage.getItem('tyredemo.settings') || '{}') || {}).mode || m; } catch (e) {}
  try { var q = new URLSearchParams(location.search).get('mode'); if (q === 'light' || q === 'dark') m = q; } catch (e) {}
  if (m !== 'light' && m !== 'dark') m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', m);
})();
</script>
